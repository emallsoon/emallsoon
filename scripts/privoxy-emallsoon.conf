# privoxy 分流配置 — emallsoon 沙箱浏览器出口
# 用法: privoxy --no-daemon /workspace/.tunnel/privoxy.conf
# 监听: 127.0.0.1:18082
#
# ⚠️ 规则顺序至关重要：privoxy 采用"最后匹配生效"（last match wins），
#    所以规则必须按 通用 → 具体 的顺序排列（默认规则最前，Google 规则最后）。
#    实测教训：默认规则放最后会覆盖所有分流规则（日志表现为
#    "Connect: via [127.0.0.1]:18080 to: www.google.com:443"）。
#
# 路由表：
#   Google 全系 → SSH SOCKS5 隧道（127.0.0.1:1080，海外出口）
#   本地回环   → 直连（dev server）
#   其余外部域 → 沙箱 HTTP 代理（127.0.0.1:18080，中国出口）
#
# 语法注意（2026-08-30 踩坑记录）：
#   - socks5h 是 curl 的参数名；privoxy 用 forward-socks5t（t=Tor式远端DNS），
#     forward-socks5 是本地解析（会被 DNS 污染，勿用）
#   - 域名模式需带尾部斜杠：.google.com/ ；纯主机名（localhost）不需要
#   - Chrome 对 file:// PAC 支持不稳（实测 MCP 启动的 Chrome 忽略 PAC），
#     故在代理层分流，Chrome 只认单一 HTTP 代理
#   - SSH 隧道断开时仅 Google 域受影响，Bing/emallsoon 日常验证不中断

debug 8191
listen-address 127.0.0.1:18082
toggle 1
enable-remote-toggle 0
enable-remote-http-toggle 0
enable-edit-actions 0
enforce-blocks 0
buffer-limit 4096
forwarded-connect-retries 0
accept-intercepted-requests 0
allow-cgi-request-crunching 0
split-large-forms 0
keep-alive-timeout 300
socket-timeout 300
max-client-connections 64

# ============ 默认规则（最先声明，优先级最低） ============

# --- 其余外部域 → 沙箱 HTTP 代理（中国出口） ---
forward / 127.0.0.1:18080

# ============ 本地直连（覆盖默认） ============
forward localhost .
forward 127.0.0.1 .

# ============ Google 全系 → SSH SOCKS5 隧道（最后声明，优先级最高） ============

# 搜索/账号/GSC
forward-socks5t google.com/ 127.0.0.1:1080 .
forward-socks5t .google.com/ 127.0.0.1:1080 .
# Google ccTLD（该出口 IP 被 Google 地理定位为中华区，google.com 会 302 到 .com.hk，
# 而 google.com.hk 不是 google.com 的子域名，不补规则会落到被墙的默认路由）
forward-socks5t google.com.hk/ 127.0.0.1:1080 .
forward-socks5t .google.com.hk/ 127.0.0.1:1080 .
forward-socks5t google.co.jp/ 127.0.0.1:1080 .
forward-socks5t .google.co.jp/ 127.0.0.1:1080 .
forward-socks5t google.co.uk/ 127.0.0.1:1080 .
forward-socks5t .google.co.uk/ 127.0.0.1:1080 .
forward-socks5t google.de/ 127.0.0.1:1080 .
forward-socks5t .google.de/ 127.0.0.1:1080 .
forward-socks5t google.fr/ 127.0.0.1:1080 .
forward-socks5t .google.fr/ 127.0.0.1:1080 .
# API 与静态资源
forward-socks5t googleapis.com/ 127.0.0.1:1080 .
forward-socks5t .googleapis.com/ 127.0.0.1:1080 .
forward-socks5t gstatic.com/ 127.0.0.1:1080 .
forward-socks5t .gstatic.com/ 127.0.0.1:1080 .
forward-socks5t googleusercontent.com/ 127.0.0.1:1080 .
forward-socks5t .googleusercontent.com/ 127.0.0.1:1080 .
forward-socks5t googlevideo.com/ 127.0.0.1:1080 .
forward-socks5t .googlevideo.com/ 127.0.0.1:1080 .
# YouTube 系
forward-socks5t youtube.com/ 127.0.0.1:1080 .
forward-socks5t .youtube.com/ 127.0.0.1:1080 .
forward-socks5t ytimg.com/ 127.0.0.1:1080 .
forward-socks5t .ytimg.com/ 127.0.0.1:1080 .
forward-socks5t ggpht.com/ 127.0.0.1:1080 .
forward-socks5t .ggpht.com/ 127.0.0.1:1080 .
# 广告与统计（GSC 页面会加载）
forward-socks5t googleadservices.com/ 127.0.0.1:1080 .
forward-socks5t .googleadservices.com/ 127.0.0.1:1080 .
forward-socks5t doubleclick.net/ 127.0.0.1:1080 .
forward-socks5t .doubleclick.net/ 127.0.0.1:1080 .
forward-socks5t googletagmanager.com/ 127.0.0.1:1080 .
forward-socks5t .googletagmanager.com/ 127.0.0.1:1080 .
forward-socks5t google-analytics.com/ 127.0.0.1:1080 .
forward-socks5t .google-analytics.com/ 127.0.0.1:1080 .
forward-socks5t appspot.com/ 127.0.0.1:1080 .
forward-socks5t .appspot.com/ 127.0.0.1:1080 .
